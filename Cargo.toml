[package]
name = "brunarias-rings-of-ai"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1"
ureq = "3"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper"] }
